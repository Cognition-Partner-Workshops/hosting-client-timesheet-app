name: Deploy Serverless

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_sonarqube:
        description: 'Start SonarQube server'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout hosting repo
        uses: actions/checkout@v4

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/client-timesheet-app
          path: app
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            lambda/package-lock.json
            app/frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: tf-outputs
        working-directory: terraform/serverless
        run: |
          terraform init -input=false
          echo "lambda_function=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm ci --production

      - name: Create Lambda deployment package
        working-directory: lambda
        run: zip -r ../lambda.zip .

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.tf-outputs.outputs.lambda_function }} \
            --zip-file fileb://lambda.zip

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ steps.tf-outputs.outputs.lambda_function }}

      - name: Build frontend
        working-directory: app/frontend
        env:
          VITE_API_URL: ${{ steps.tf-outputs.outputs.api_endpoint }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to S3
        run: |
          aws s3 sync app/frontend/dist/ s3://${{ steps.tf-outputs.outputs.frontend_bucket }} --delete

      - name: Health check
        run: |
          echo "Checking API health..."
          curl -f "${{ steps.tf-outputs.outputs.api_endpoint }}/health" || exit 1
          echo "✅ API is healthy"

  sonarqube-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event.inputs.deploy_sonarqube == 'true' || github.event_name == 'push'
    
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/client-timesheet-app
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure SonarQube is running
        run: |
          # Scale up SonarQube if needed
          DESIRED=$(aws ecs describe-services \
            --cluster client-timesheet-app-sonarqube \
            --services sonarqube \
            --query 'services[0].desiredCount' \
            --output text)
          
          if [ "$DESIRED" == "0" ]; then
            echo "Starting SonarQube..."
            aws ecs update-service \
              --cluster client-timesheet-app-sonarqube \
              --service sonarqube \
              --desired-count 1
            
            # Wait for task to be running
            echo "Waiting for SonarQube to start..."
            sleep 120
          fi

      - name: Get SonarQube URL
        id: sonar-url
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster client-timesheet-app-sonarqube \
            --service-name sonarqube \
            --query 'taskArns[0]' \
            --output text)
          
          ENI_ID=$(aws ecs describe-tasks \
            --cluster client-timesheet-app-sonarqube \
            --tasks $TASK_ARN \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text)
          
          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids $ENI_ID \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)
          
          echo "sonar_url=http://$PUBLIC_IP:9000" >> $GITHUB_OUTPUT

      - name: Wait for SonarQube to be ready
        run: |
          echo "Waiting for SonarQube at ${{ steps.sonar-url.outputs.sonar_url }}..."
          for i in {1..30}; do
            if curl -s "${{ steps.sonar-url.outputs.sonar_url }}/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 10
          done
          echo "SonarQube did not become ready in time"
          exit 1

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ steps.sonar-url.outputs.sonar_url }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=client-timesheet-app
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

      - name: Scale down SonarQube (cost savings)
        if: always()
        run: |
          echo "Scaling down SonarQube to save costs..."
          aws ecs update-service \
            --cluster client-timesheet-app-sonarqube \
            --service sonarqube \
            --desired-count 0
