AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bootstrap stack for Client Timesheet App.
  Creates foundational resources: S3 bucket for state, DynamoDB for locks,
  ECR repository, and GitHub Actions OIDC provider with IAM role.

Parameters:
  AWSRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for resources

  AllowDestroy:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Allow destruction of bootstrap resources (S3 bucket, ECR). Set to false for production.

  GitHubOrg:
    Type: String
    Default: Cognition-Partner-Workshops
    Description: GitHub organization name for OIDC trust policy

  GitHubRepo:
    Type: String
    Default: hosting-client-timesheet-app
    Description: GitHub repository name for OIDC trust policy

Resources:
  # =============================================================================
  # Terraform State Backend Resources
  # =============================================================================

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [AllowDestroyCondition, Delete, Retain]
    UpdateReplacePolicy: !If [AllowDestroyCondition, Delete, Retain]
    Properties:
      BucketName: !Sub 'client-timesheet-terraform-state-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: shared
        - Key: Project
          Value: client-timesheet-app
        - Key: ManagedBy
          Value: cloudformation-bootstrap
        - Key: Name
          Value: Terraform State Bucket

  TerraformLocksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: client-timesheet-terraform-locks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      Tags:
        - Key: Environment
          Value: shared
        - Key: Project
          Value: client-timesheet-app
        - Key: ManagedBy
          Value: cloudformation-bootstrap
        - Key: Name
          Value: Terraform Lock Table

  # =============================================================================
  # GitHub Actions OIDC Provider and Deployment Role (Least Privilege)
  # =============================================================================

  GitHubActionsOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Environment
          Value: shared
        - Key: Project
          Value: client-timesheet-app
        - Key: ManagedBy
          Value: cloudformation-bootstrap
        - Key: Name
          Value: GitHub Actions OIDC Provider

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: client-timesheet-github-actions-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubActionsOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      Tags:
        - Key: Environment
          Value: shared
        - Key: Project
          Value: client-timesheet-app
        - Key: ManagedBy
          Value: cloudformation-bootstrap
        - Key: Name
          Value: GitHub Actions Deploy Role

  GitHubActionsECRPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: ecr-push-pull
      RoleName: !Ref GitHubActionsDeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ECRGetAuthToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: ECRPushPull
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
            Resource: !GetAtt ECRRepository.Arn

  GitHubActionsEC2Policy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: ec2-describe
      RoleName: !Ref GitHubActionsDeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EC2DescribeAll
            Effect: Allow
            Action:
              - ec2:DescribeInstances
            Resource: '*'

  GitHubActionsSSMPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: ssm-send-command
      RoleName: !Ref GitHubActionsDeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SSMSendCommand
            Effect: Allow
            Action:
              - ssm:SendCommand
            Resource:
              - !Sub 'arn:aws:ssm:${AWSRegion}::document/AWS-RunShellScript'
              - !Sub 'arn:aws:ec2:${AWSRegion}:${AWS::AccountId}:instance/*'
            Condition:
              StringEquals:
                ssm:resourceTag/Project: client-timesheet-app
          - Sid: SSMGetCommandInvocation
            Effect: Allow
            Action:
              - ssm:GetCommandInvocation
            Resource: '*'

  # =============================================================================
  # ECR Repository
  # =============================================================================

  ECRRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: !If [AllowDestroyCondition, Delete, Retain]
    UpdateReplacePolicy: !If [AllowDestroyCondition, Delete, Retain]
    Properties:
      RepositoryName: client-timesheet-app
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: shared
        - Key: Project
          Value: client-timesheet-app
        - Key: ManagedBy
          Value: cloudformation-bootstrap
        - Key: Name
          Value: Client Timesheet App ECR

Conditions:
  AllowDestroyCondition: !Equals [!Ref AllowDestroy, 'true']

Outputs:
  TerraformStateBucket:
    Description: S3 bucket for Terraform state
    Value: !Ref TerraformStateBucket
    Export:
      Name: !Sub '${AWS::StackName}-TerraformStateBucket'

  TerraformLockTable:
    Description: DynamoDB table for Terraform state locking
    Value: !Ref TerraformLocksTable
    Export:
      Name: !Sub '${AWS::StackName}-TerraformLockTable'

  ECRRepositoryUrl:
    Description: ECR repository URL for the application
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-ECRRepositoryUrl'

  ECRRepositoryName:
    Description: ECR repository name
    Value: !Ref ECRRepository
    Export:
      Name: !Sub '${AWS::StackName}-ECRRepositoryName'

  ECRRepositoryArn:
    Description: ECR repository ARN
    Value: !GetAtt ECRRepository.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ECRRepositoryArn'

  AWSAccountId:
    Description: AWS Account ID
    Value: !Ref AWS::AccountId
    Export:
      Name: !Sub '${AWS::StackName}-AWSAccountId'

  GitHubActionsRoleArn:
    Description: IAM Role ARN for GitHub Actions to assume via OIDC
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsRoleArn'

  GitHubActionsOIDCProviderArn:
    Description: GitHub Actions OIDC Provider ARN
    Value: !GetAtt GitHubActionsOIDCProvider.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsOIDCProviderArn'
