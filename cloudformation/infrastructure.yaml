AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Application infrastructure for Client Timesheet App.
  Creates EC2 instance, security groups, IAM roles, and Elastic IP.

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name for tagging

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  ECRRepositoryUrl:
    Type: String
    Description: ECR repository URL for the application (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/client-timesheet-app)

  ECRRepositoryArn:
    Type: String
    Description: ECR repository ARN for IAM policy scoping

  AppPort:
    Type: Number
    Default: 3001
    Description: Application port

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI ID from SSM Parameter Store

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: client-timesheet-app-sg
      GroupDescription: Security group for Client Timesheet App
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access for the application
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS access for the application
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: client-timesheet-app-sg
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: client-timesheet-app

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: client-timesheet-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: client-timesheet-ec2-role
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: client-timesheet-app

  EC2ECRPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ecr-access-policy
      Roles:
        - !Ref EC2Role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ECRGetAuthToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: ECRPullImages
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: !Ref ECRRepositoryArn

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: client-timesheet-ec2-profile
      Roles:
        - !Ref EC2Role

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !GetAtt AppSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Log all output
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

          echo "Starting user data script..."

          # Update system
          dnf update -y

          # Install and start SSM agent (required for SSM Session Manager access)
          dnf install -y amazon-ssm-agent
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent

          # Install Docker
          dnf install -y docker
          systemctl start docker
          systemctl enable docker

          # Add ec2-user to docker group
          usermod -aG docker ec2-user

          # Install AWS CLI (already installed on AL2023, but ensure it's available)
          dnf install -y aws-cli

          # Create app directory
          mkdir -p /opt/app
          mkdir -p /opt/app/data

          # Create deployment script
          cat > /opt/app/deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          AWS_REGION="${AWS::Region}"
          ECR_REPOSITORY="${ECRRepositoryUrl}"
          APP_PORT="${AppPort}"

          echo "Logging into ECR..."
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY

          echo "Pulling latest image..."
          docker pull $ECR_REPOSITORY:latest

          echo "Stopping existing container..."
          docker stop client-timesheet-app 2>/dev/null || true
          docker rm client-timesheet-app 2>/dev/null || true

          echo "Starting new container..."
          docker run -d \
            --name client-timesheet-app \
            --restart unless-stopped \
            -p 80:$APP_PORT \
            -v /opt/app/data:/app/data \
            -e NODE_ENV=production \
            -e PORT=$APP_PORT \
            -e DATABASE_PATH=/app/data/timesheet.db \
            $ECR_REPOSITORY:latest

          echo "Cleaning up old images..."
          docker image prune -f

          echo "Deployment complete!"
          DEPLOY_SCRIPT

          chmod +x /opt/app/deploy.sh

          # Create systemd service for auto-restart
          cat > /etc/systemd/system/client-timesheet-app.service << 'SERVICE'
          [Unit]
          Description=Client Timesheet App
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/opt/app/deploy.sh
          ExecStop=/usr/bin/docker stop client-timesheet-app

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable client-timesheet-app

          echo "User data script completed successfully!"
      Tags:
        - Key: Name
          Value: client-timesheet-app
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: client-timesheet-app

  AppElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref AppInstance
      Tags:
        - Key: Name
          Value: client-timesheet-app-eip
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: client-timesheet-app

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref AppInstance

  InstancePublicIP:
    Description: EC2 instance public IP (Elastic IP)
    Value: !Ref AppElasticIP

  AppUrl:
    Description: Application URL
    Value: !Sub 'http://${AppElasticIP}'

  SecurityGroupId:
    Description: Security group ID
    Value: !GetAtt AppSecurityGroup.GroupId
